<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLB Morph Inspector</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #122033;
      background: #f5f7fb;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      color: #5a6678;
      margin: 0 0 18px;
    }

    input,
    button {
      font: inherit;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      gap: 16px;
      align-items: start;
    }

    #viewport {
      min-height: 560px;
      background: #dfe8f3;
      border: 1px solid #ccd7e6;
    }

    aside {
      background: #fff;
      border: 1px solid #d7dfeb;
      padding: 14px;
      max-height: 560px;
      overflow: auto;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.45;
      background: #0f172a;
      color: #dbeafe;
      padding: 12px;
      overflow: auto;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 16px 0;
      flex-wrap: wrap;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main>
    <h1>GLB Morph Inspector</h1>
    <p>Carga el GLB exportado desde Blender para ver meshes, morphTargetDictionary y nombres exactos de shape keys.</p>
    <div class="controls">
      <input id="fileInput" type="file" accept=".glb,.gltf">
      <button id="downloadReport" type="button" disabled>Descargar reporte JSON</button>
    </div>
    <div class="grid">
      <div id="viewport"></div>
      <aside>
        <pre id="report">Esperando GLB...</pre>
      </aside>
    </div>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const viewport = document.getElementById("viewport");
    const reportEl = document.getElementById("report");
    const fileInput = document.getElementById("fileInput");
    const downloadButton = document.getElementById("downloadReport");

    let scene = null;
    let camera = null;
    let renderer = null;
    let controls = null;
    let loadedScene = null;
    let lastReport = null;
    let animationFrame = 0;
    const hiddenMeshNameParts = ["eyeocclusion", "tearline", "sphere01", "default"];
    const transparentMaterialNameParts = ["eyelash"];

    function resize() {
      if (!renderer || !camera) return;
      const rect = viewport.getBoundingClientRect();
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / Math.max(1, rect.height);
      camera.updateProjectionMatrix();
    }

    function initRenderer() {
      if (renderer) return true;

      try {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdfe8f3);
        camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
        camera.position.set(0, 1.55, 3.2);
        renderer = new THREE.WebGLRenderer({
          antialias: false,
          alpha: false,
          powerPreference: "high-performance",
          failIfMajorPerformanceCaveat: false,
        });
      } catch (error) {
        reportEl.textContent = [
          "No se pudo crear un contexto WebGL.",
          "",
          "Chrome bloqueo WebGL para esta pestaña/origen despues de una perdida de contexto.",
          "Acciones:",
          "1. Cerrar esta pestaña.",
          "2. Abrir una pestaña nueva o reiniciar Chrome.",
          "3. Volver a cargar el inspector y seleccionar el GLB.",
          "",
          `Detalle: ${error.message || error}`,
        ].join("\n");
        return false;
      }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      viewport.innerHTML = "";
      viewport.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.35, 0);
      controls.update();

      scene.add(new THREE.HemisphereLight(0xffffff, 0x607080, 2.4));
      const key = new THREE.DirectionalLight(0xffffff, 2.6);
      key.position.set(2, 4, 3);
      scene.add(key);

      resize();
      animate();
      return true;
    }

    function frameObject(object) {
      const headObject = object.getObjectByName("CC_Base_Body") || object;
      const box = new THREE.Box3().setFromObject(headObject);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const target = new THREE.Vector3(center.x, center.y + size.y * 0.31, center.z);
      controls.target.copy(target);
      camera.position.set(target.x, target.y + size.y * 0.02, target.z + Math.max(size.x, size.y, size.z) * 0.43);
      camera.near = 0.01;
      camera.far = 100;
      camera.updateProjectionMatrix();
      controls.update();
    }

    function normalizedName(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    }

    function shouldHideMesh(node) {
      const name = normalizedName(node.name);
      return hiddenMeshNameParts.some((part) => name.includes(part));
    }

    function shouldSimplifyTransparentMaterial(material) {
      const name = String(material?.name || "").toLowerCase();
      return transparentMaterialNameParts.some((part) => name.includes(part));
    }

    function buildEyeFallbackMaterial(material, node) {
      const name = String(material?.name || "");
      const lower = name.toLowerCase();
      if (lower.includes("cornea")) {
        return new THREE.MeshPhysicalMaterial({
          name: `${name || "cornea"}__inspector_safe`,
          color: 0xffffff,
          roughness: 0.04,
          metalness: 0,
          transmission: 0,
          transparent: true,
          opacity: 0.22,
          side: THREE.DoubleSide,
          depthWrite: false,
          skinning: Boolean(node.isSkinnedMesh),
          morphTargets: Boolean(node.morphTargetDictionary),
          morphNormals: true,
        });
      }

      return null;
    }

    function simplifyProblematicMaterials(root) {
      root.traverse((node) => {
        if (!node.isMesh && !node.isSkinnedMesh) return;
        if (shouldHideMesh(node)) {
          node.visible = false;
          return;
        }

        const materials = Array.isArray(node.material) ? node.material : [node.material];
        const nextMaterials = materials.map((material) => {
          const eyeFallback = buildEyeFallbackMaterial(material, node);
          if (eyeFallback) return eyeFallback;
          if (!material || !shouldSimplifyTransparentMaterial(material)) return material;

          const color = material.color ? material.color.clone() : new THREE.Color(0xffffff);
          const replacement = new THREE.MeshStandardMaterial({
            name: `${material.name || "material"}__inspector_safe`,
            color,
            roughness: 0.78,
            metalness: 0,
            transparent: false,
            opacity: 1,
            side: THREE.DoubleSide,
            skinning: Boolean(node.isSkinnedMesh),
            morphTargets: Boolean(node.morphTargetDictionary),
            morphNormals: true,
          });

          if (material.map) {
            replacement.map = material.map;
          }

          return replacement;
        });

        node.material = Array.isArray(node.material) ? nextMaterials : nextMaterials[0];
      });
    }

    function buildReport(root) {
      const meshes = [];
      const bones = [];
      const materials = new Set();

      root.traverse((node) => {
        if (node.isBone) bones.push(node.name);
        if (!node.isMesh && !node.isSkinnedMesh) return;

        const dict = node.morphTargetDictionary || {};
        const materialList = Array.isArray(node.material) ? node.material : [node.material].filter(Boolean);
        materialList.forEach((material) => materials.add(material.name || "(sin nombre)"));
        meshes.push({
          name: node.name,
          type: node.isSkinnedMesh ? "SkinnedMesh" : "Mesh",
          materialNames: materialList.map((material) => material.name || "(sin nombre)"),
          morphTargetCount: Object.keys(dict).length,
          morphTargetDictionary: dict,
        });
      });

      return {
        summary: {
          meshCount: meshes.length,
          meshesWithMorphs: meshes.filter((mesh) => mesh.morphTargetCount > 0).map((mesh) => mesh.name),
          boneCount: bones.length,
          materialCount: materials.size,
        },
        meshes,
        bones,
        materials: Array.from(materials).sort(),
      };
    }

    function animate() {
      animationFrame = requestAnimationFrame(animate);
      if (!renderer || !scene || !camera) return;
      renderer.render(scene, camera);
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (!initRenderer()) return;

      const url = URL.createObjectURL(file);
      try {
        const gltf = await new GLTFLoader().loadAsync(url);
        if (loadedScene) scene.remove(loadedScene);
        loadedScene = gltf.scene;
        simplifyProblematicMaterials(loadedScene);
        scene.add(loadedScene);
        frameObject(loadedScene);
        lastReport = buildReport(loadedScene);
        reportEl.textContent = JSON.stringify(lastReport, null, 2);
        downloadButton.disabled = false;
      } finally {
        URL.revokeObjectURL(url);
      }
    });

    downloadButton.addEventListener("click", () => {
      if (!lastReport) return;
      const blob = new Blob([JSON.stringify(lastReport, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "glb-morph-report.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    window.addEventListener("resize", resize);
    window.addEventListener("beforeunload", () => {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (renderer) renderer.dispose();
    });
  </script>
</body>
</html>
