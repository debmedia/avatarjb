<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveAvatar Gemini Demo</title>
  <link rel="stylesheet" href="./css/avatar3d-demo.css">
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script type="module" src="./js/avatar3d-gemini-demo.js"></script>
</head>
<body>
  <main class="demo-shell">
    <section class="stage" aria-label="LiveAvatar HeyGen">
      <div id="liveAvatarStage" class="liveavatar-stage">
        <video id="liveAvatarVideo" autoplay playsinline></video>
        <div id="liveAvatarPlaceholder" class="liveavatar-placeholder">
          Conectando LiveAvatar local...
        </div>
      </div>
      <div class="status-pill">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Preparando LiveAvatar</span>
      </div>
      <section id="actionPanel" class="action-panel" aria-live="polite" hidden></section>
    </section>

    <aside class="panel" aria-label="Controles">
      <div>
        <h1>LiveAvatar Gemini</h1>
        <p>HeyGen LiveAvatar LITE como video realtime. Gemini queda a cargo de la voz, el prompt y la tool bancaria.</p>
      </div>

      <div class="config-column">
        <div class="liveavatar-controls" aria-label="Seleccion de avatar LiveAvatar">
          <label>
            Filtro LiveAvatar
            <select id="liveAvatarScopeSelect">
              <option value="public">Publicos</option>
              <option value="user">Mis avatares</option>
            </select>
          </label>
          <label>
            Avatar LiveAvatar
            <select id="liveAvatarSelect">
              <option value="">Conecta el bridge para cargar avatares</option>
            </select>
          </label>
          <div class="liveavatar-picker-row">
            <button id="refreshLiveAvatarsButton" type="button">Actualizar</button>
            <button id="connectAvatarButton" type="button">Conectar avatar</button>
          </div>
          <span id="liveAvatarPickerStatus" class="picker-status">Bridge local requerido</span>
        </div>

        <label>
          Microfono
          <select id="micSelect">
            <option value="">Predeterminado del sistema</option>
          </select>
        </label>

        <label>
          Gemini API key
          <input id="apiKeyInput" type="password" autocomplete="off" placeholder="AIza...">
        </label>

        <label>
          Voz Gemini
          <select id="voiceSelect">
            <option value="Charon">Charon</option>
            <option value="Puck">Puck</option>
            <option value="Kore">Kore</option>
            <option value="Fenrir">Fenrir</option>
            <option value="Aoede">Aoede</option>
            <option value="Leda">Leda</option>
            <option value="Orus">Orus</option>
            <option value="Zephyr">Zephyr</option>
          </select>
        </label>

        <label>
          Prompt
          <textarea id="promptInput" rows="14">Eres un ejecutivo bancario virtual de Santiago de Chile. Habla en espanol chileno santiaguino, cordial, cercano y tranquilo, con ritmo pausado pero natural. Suena como alguien atendiendo en una sucursal chilena: usa expresiones como "mira", "claro", "perfecto", "super", "te cuento", "cuentame", "si te parece", "revisemos", "de todas maneras", "altiro" y "un momentito por favor". Puedes usar "po" muy ocasionalmente, solo si suena natural. Evita sonar argentino o neutro internacional: no uses "vos", "tenes", "queres", "dale", "aguarda", "vale" ni "de acuerdo" como muletilla principal. No exageres los modismos.

Vas a simular con el usuario la creacion de una cuenta bancaria. Guia el proceso paso a paso: tipo de cuenta, requisitos generales, datos personales ficticios de prueba y confirmacion final. No pidas claves, PIN, contrasenas, codigos SMS, numeros reales de tarjetas ni datos bancarios reales. Si necesitas datos sensibles, pide datos ficticios.

Regla critica de flujo: cuando necesites avanzar la simulacion o mostrar opciones, llama silenciosamente la herramienta consultar_flujo_bancario. No inventes botones por tu cuenta. La herramienta devolvera respuesta, form y buttons; tu voz debe decir solo la respuesta en forma natural. NO digas por voz el nombre de la herramienta, NO leas JSON, NO digas "form", "buttons", "label", "value", "tool" ni "function call".</textarea>
        </label>

        <div id="liveAvatarStatus" class="bridge-status">LiveAvatar: esperando bridge</div>
        <div id="micStatus" class="bridge-status">Microfono: esperando</div>
        <div id="geminiStatus" class="bridge-status">Gemini: esperando</div>

        <div class="actions">
          <button id="startButton" type="button">Iniciar</button>
          <button id="muteButton" type="button" disabled>Mutear</button>
          <button id="stopButton" type="button" disabled>Detener</button>
        </div>
      </div>
    </aside>
  </main>
</body>
</html>
